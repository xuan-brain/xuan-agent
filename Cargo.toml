[workspace]
members = [
    "crates/xuan-agent",
    "crates/xuan-agent-cli",
    "crates/xuan-agent-web",
    "mcp-servers/mcp-server-reading",
]
resolver = "2"

[workspace.dependencies]
# Rig 框架 - LLM 应用统一抽象
rig-core = "0.31.0"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
anyhow = "1"
thiserror = "2"

# 配置加载
dotenvy = "0.15"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI 工具
clap = { version = "4", features = ["derive"] }

# HTTP 客户端
reqwest = { version = "0.13", features = ["json"] }

# 数据库
surrealdb = "3"

# 向量与相似度计算
ndarray = "0.15"

# JSON-RPC
jsonrpc-core = "18"

# PDF 处理
pdf-extract = "0.7"

# Web 框架
axum = "0.7"
tower = "0.4"
tower-http = "0.5"

# 异步 traits
async-trait = "0.1"
